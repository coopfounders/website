<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#071727" />
    <meta name="description" content="The Coop launch blog is coming soon." />
    <title>Launch Blog — Coop</title>
    <link rel="icon" href="assets/coop-favicon.png" />
    <link rel="stylesheet" href="styles.css" />
    <script src="app.js" defer></script>
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="index.html" aria-label="Coop home">
        <img src="assets/coop-wordmark-white.png" alt="Coop" />
      </a>
      <nav aria-label="Primary navigation">
        <a class="blog-link" href="index.html">Home</a>
        <button class="partner-button" type="button" data-partner-open>Partner with us</button>
      </nav>
    </header>

    <main>
      <article class="launch-note">
        <p class="status"><span></span> Launch blog</p>
        <h1>The robots shipped.<br />The coordination didn’t.</h1>
        <p class="launch-coming">Our launch note is coming soon.</p>
      </article>
    </main>

    <dialog class="partner-dialog" data-partner-dialog aria-labelledby="partner-title">
      <button class="dialog-close" type="button" data-partner-close aria-label="Close">×</button>
      <img class="dialog-logo" src="assets/coop-wordmark-navy.png" alt="Coop" />
      <p class="dialog-eyebrow">Partner with Coop</p>
      <h2 id="partner-title">Let’s build a better hospital operation.</h2>
      <p>Leave your work email and our founding team will be in touch.</p>
      <form action="/api/partner" method="POST" data-partner-form>
        <label for="email">Work email</label>
        <div class="email-row">
          <input id="email" name="email" type="email" autocomplete="email" placeholder="you@hospital.org" required />
          <button type="submit" data-submit-button>Submit <span>↗</span></button>
        </div>
        <input class="honey" type="text" name="website" tabindex="-1" autocomplete="off" aria-hidden="true" />
        <p class="form-status" data-form-status aria-live="polite"></p>
      </form>
      <div class="email-divider"><span>or</span></div>
      <p class="direct-email">
        Email us directly at
        <a href="mailto:founders@cooplabs.com">founders@cooplabs.com</a>
      </p>
    </dialog>
  </body>
</html>
