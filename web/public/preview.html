<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Preview</title>
  </head>
  <body>
    <script>
      // Artifact preview bootstrap. The chat app frames this page in a
      // sandboxed iframe (no same-origin access) and passes the snippet as
      // base64 in the URL fragment (never sent to the server). Loading via a
      // real URL — instead of srcdoc — gives the preview its own CSP rather
      // than inheriting the app's strict one, so inline scripts can run. The
      // document we write injects its own CSP meta that blocks all network.
      (function () {
        try {
          var b64 = location.hash.slice(1);
          var html = decodeURIComponent(escape(atob(b64)));
          document.open();
          document.write(html);
          document.close();
        } catch (e) {
          document.body.textContent = "Preview failed to load.";
        }
      })();
    </script>
  </body>
</html>
