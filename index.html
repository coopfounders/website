<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#071727" />
    <meta name="description" content="Coop is automating hospital workflows." />
    <title>Coop</title>
    <link rel="icon" href="assets/coop-favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500&amp;display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
    <script defer src="/_vercel/insights/script.js"></script>
    <script src="app.js" defer></script>
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="index.html" aria-label="Coop home">
        <img src="assets/coop-wordmark-white.png" alt="Coop" />
      </a>
      <!-- Launch navigation — uncomment when the launch page is ready.
      <nav aria-label="Primary navigation">
        <a class="launch-link" href="launch.html">Read the Launch</a>
      </nav>
      -->
    </header>

    <main>
      <section class="hero" aria-labelledby="hero-title">
        <h1 id="hero-title">Automating Hospital<br />Workflows</h1>
        <button class="partner-button hero-partner-button" type="button" data-partner-open>Partner with us</button>
        <div class="backers" aria-label="Backed by a16z Speedrun and NVIDIA Inception">
          <span>Backed by</span>
          <img class="speedrun-mark" src="assets/speedrun-logo.png" alt="a16z Speedrun" />
          <i aria-hidden="true"></i>
          <img class="nvidia-mark" src="assets/nvidia-inception-white.png" alt="NVIDIA Inception" />
        </div>
      </section>
    </main>

    <dialog class="partner-dialog" data-partner-dialog aria-labelledby="partner-title">
      <button class="dialog-close" type="button" data-partner-close aria-label="Close">×</button>
      <img class="dialog-logo" src="assets/coop-wordmark-navy.png" alt="Coop" />
      <p class="dialog-eyebrow">Partner with Coop</p>
      <h2 id="partner-title">Let’s build a better hospital operation.</h2>
      <p>Leave your work email and our founding team will be in touch.</p>
      <form class="partner-form" action="/api/partner" method="POST" data-partner-form>
        <div class="form-field">
          <label for="email">Work email</label>
          <input id="email" name="email" type="email" autocomplete="email" placeholder="you@company.com" required />
        </div>
        <div class="form-field">
          <label for="message">How can we help? <span class="optional-label">Optional</span></label>
          <textarea id="message" name="message" rows="4" maxlength="2000" placeholder="Tell us what you're working on and how you'd like to partner."></textarea>
        </div>
        <button class="form-submit" type="submit" data-submit-button>Send inquiry</button>
        <input class="honey" type="text" name="website" tabindex="-1" autocomplete="off" aria-hidden="true" />
        <p class="form-status" data-form-status aria-live="polite"></p>
      </form>
      <div class="email-divider"><span>or</span></div>
      <p class="direct-email">
        Email us directly at
        <a href="mailto:founders@cooplabs.com">founders@cooplabs.com</a>
      </p>
    </dialog>
  </body>
</html>
